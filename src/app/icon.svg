<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F42F0"/>
      <stop offset="100%" stop-color="#1928B3"/>
    </linearGradient>
    <filter id="neo-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="8" dy="12" stdDeviation="0" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with neobrutalist border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)" stroke="#000000" stroke-width="18"/>

  <!-- Chat Speech Bubble -->
  <g filter="url(#neo-shadow)">
    <!-- Main speech bubble body -->
    <path d="M 120 130 C 120 100, 140 85, 175 85 L 345 85 C 380 85, 400 100, 400 130 L 400 290 C 400 320, 380 335, 345 335 L 230 335 L 150 410 L 165 335 L 175 335 C 140 335, 120 320, 120 290 Z" 
          fill="#FFFDF0" 
          stroke="#000000" 
          stroke-width="16" 
          stroke-linejoin="round"/>
    
    <!-- Bold TalkLab "TL" Monogram -->
    <!-- Letter T -->
    <path d="M 175 160 L 265 160 M 220 160 L 220 270" 
          stroke="#2F42F0" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Letter L -->
    <path d="M 285 160 L 285 270 L 350 270" 
          stroke="#FF4D4D" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Neo Sparkle / Star in top-right -->
  <path d="M 405 65 Q 405 105 445 105 Q 405 105 405 145 Q 405 105 365 105 Q 405 105 405 65 Z" 
        fill="#FFE066" 
        stroke="#000000" 
        stroke-width="8"/>
</svg>
