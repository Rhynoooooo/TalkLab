# ==============================================================================
# TalkLab 2.0 - Production Nginx Reverse Proxy Configuration
# Single-Origin Topology: SSL Termination, Static Asset Caching, Daemon Isolation
# Venue: People & Spaces (مركز سفراء العلم) • Tripoli, Libya
# ==============================================================================

# Rate limiting zones to protect auth & WhatsApp gateways against brute-force
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

# HTTP -> HTTPS Redirect Server Block
server {
    listen 80;
    listen [::]:80;
    server_name talklab.ly www.talklab.ly;

    # ACME Challenge location for Let's Encrypt / Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Production Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name talklab.ly www.talklab.ly;

    # SSL Certificates (managed via Certbot or custom certificate paths)
    ssl_certificate /etc/letsencrypt/live/talklab.ly/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talklab.ly/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/talklab.ly/chain.pem;

    # Modern TLS & Cipher Hardening (Mozilla Intermediate standard)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security & Privacy Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;

    # Buffer & Size Limits
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Gzip Compression for Next.js assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. Next.js Immutable Static Assets Caching (1 Year Cache)
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Immutable cache headers for fingerprinted assets
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files (images, audio, icons)
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|mp3|wav|ogg|ttf|woff|woff2)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # --------------------------------------------------------------------------
    # 2. Strict Daemon Isolation (OpenWA port 2785 protection)
    # Block any direct attempts to traverse or hit daemon endpoints from WAN
    # --------------------------------------------------------------------------
    location ~* ^/(?:api/sessions|socket\.io|openwa-daemon) {
        deny all;
        return 403 "Direct access to internal communication daemons is forbidden.\n";
    }

    # --------------------------------------------------------------------------
    # 3. Rate-Limited Admin Authentication Endpoints
    # --------------------------------------------------------------------------
    location /api/admin/login {
        limit_req zone=admin_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 4. Rate-Limited WhatsApp OTP Gateway
    # --------------------------------------------------------------------------
    location /api/openwa/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 5. Primary Application Reverse Proxy (Next.js 16 App Router)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket / Server-Sent Events headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Downstream proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
